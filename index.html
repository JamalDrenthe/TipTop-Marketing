<!doctype html>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var stored = localStorage.getItem('tiptop-theme');
        var isDark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', isDark);
        document.querySelector('meta[name="color-scheme"]').content = stored || 'light dark';
      } catch (e) {}
    </script>
    <title>TipTop Marketing — Schaal je marketing naar de Top</title>

    <meta name="author" content="TipTop Marketing" />
